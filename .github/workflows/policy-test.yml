# SPDX-License-Identifier: GPL-3.0-or-later
# THROWAWAY: proves the Actions policy refuses third-party actions. Never merge.
name: Actions policy test

on:
    pull_request:

permissions:
    contents: read

jobs:
    github-owned:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

    third-party:
        runs-on: ubuntu-latest
        steps:
            - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
              with:
                registry: ghcr.io
                username: nobody
                password: nothing
