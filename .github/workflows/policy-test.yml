# THROWAWAY: proves the Actions policy refuses third-party actions. Never merge.
name: Actions policy test

on:
    pull_request:

permissions:
    contents: read

jobs:
    github-owned:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
