name: CI - Main Branch

permissions:
    contents: read
    # Main is the only branch that publishes the devcontainer image, which then
    # serves as the layer cache every pull request pulls from. Same discipline as
    # a build cache: write on main, read everywhere else.
    packages: write

on:
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: "-Dwarnings"
    DEVCONTAINER_IMAGE: ghcr.io/setonix-os/kernel-devcontainer

# Identical to ci_pr.yml except that this workflow *publishes* the devcontainer
# image after the checks pass, so pull requests never build from an image that
# has not itself been proven to build and boot the kernel.
jobs:
    checks:
        name: Checks (pins, spelling, fmt, clippy, markdown)
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Run checks in the devcontainer
              uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
              with:
                imageName: ${{ env.DEVCONTAINER_IMAGE }}
                cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
                # Published only after the boot job below has also passed, so
                # this step builds and runs without pushing.
                push: never
                runCmd: |
                    set -euo pipefail

                    echo "::group::Environment"
                    rustc --version
                    cargo --version
                    qemu-system-aarch64 --version | head -1
                    markdownlint-cli2 --version
                    echo "::endgroup::"

                    echo "::group::Toolchain pins"
                    bash .github/scripts/check-toolchain-pin.sh
                    echo "::endgroup::"

                    echo "::group::British spelling"
                    bash .github/scripts/check-british-spelling.sh
                    echo "::endgroup::"

                    echo "::group::Formatting"
                    cargo fmt --all --check
                    echo "::endgroup::"

                    echo "::group::Markdown"
                    markdownlint-cli2 "**/*.md"
                    echo "::endgroup::"

                    for target in aarch64-unknown-none-softfloat x86_64-unknown-none; do
                        echo "::group::$target"
                        cargo clippy --package setonix-kernel --all-features --target "$target" -- -D warnings
                        cargo build --verbose --package setonix-kernel --target "$target"
                        cargo build --release --verbose --package setonix-kernel --target "$target"
                        echo "::endgroup::"
                    done

                    echo "::group::xtask (host)"
                    cargo clippy --package xtask --all-targets --all-features -- -D warnings
                    cargo test --verbose --package xtask
                    echo "::endgroup::"

    boot:
        name: Boot (QEMU aarch64 virt)
        needs: checks
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            # Debug and release are both booted here. They differ enough in
            # layout and inlining that a debug-only boot test has let real faults
            # through in other kernels.
            #
            # This step also publishes the image, and does so last on purpose: an
            # image only becomes the cache for every pull request after it has
            # been shown to build the kernel *and* boot it.
            - name: Boot in the devcontainer, then publish the image
              uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
              with:
                imageName: ${{ env.DEVCONTAINER_IMAGE }}
                cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
                push: always
                runCmd: |
                    set -euo pipefail
                    cargo xtask boot-test --arch aarch64 --expect "Kaya!"
                    cargo xtask boot-test --arch aarch64 --release --expect "Kaya!"
                    cargo xtask boot-test --arch aarch64 --features provoke-exception --expect "BRK instruction"

    ci-success:
        name: CI Success
        needs: [checks, boot]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: ${{ !cancelled() }}

        steps:
            - name: Check if all jobs succeeded
              run: |
                if [[ "${{ needs.checks.result }}" != "success" ]] ||
                   [[ "${{ needs.boot.result }}" != "success" ]]; then
                    echo "One or more jobs failed"
                    exit 1
                fi
                echo "All jobs completed successfully"
