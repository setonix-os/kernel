name: CI - Main Branch

# Read-only by default. The one job that publishes raises its own scope below,
# so the checks job never holds write access to the registry.
permissions:
    contents: read
    packages: read

on:
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# A container inherits none of the runner's environment, only the image's own
# and what `docker run` names with -e. Every step that runs in the devcontainer
# therefore names CARGO_TERM_COLOR and RUSTFLAGS there; a bare `-e NAME` copies
# its value from this block, which stays the single source.
env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: "-Dwarnings"
    DEVCONTAINER_IMAGE: ghcr.io/setonix-os/kernel-devcontainer

# bash with pipefail, rather than the runner's default of plain `bash -e`.
defaults:
    run:
        shell: bash

# Identical to ci_pr.yml except that this workflow *publishes* the devcontainer
# image after the checks pass, so pull requests never build from an image that
# has not itself been proven to build and boot the kernel. ci_pr.yml's header
# says what the build and run steps reproduce of devcontainers/ci, and why they
# are plain docker.
jobs:
    checks:
        name: Checks (pins, spelling, fmt, clippy, markdown)
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                # Nothing after checkout uses git credentials, so none are persisted.
                persist-credentials: false

            # Published only after the boot job below has also passed, so this
            # job builds and runs without pushing.
            - name: Build the devcontainer image
              run: |
                docker buildx build \
                    --load \
                    --build-arg BUILDKIT_INLINE_CACHE=1 \
                    --cache-from "type=registry,ref=${DEVCONTAINER_IMAGE}:latest" \
                    --tag "${DEVCONTAINER_IMAGE}:latest" \
                    --file .devcontainer/Dockerfile \
                    .devcontainer

            # The list of checks exists once, in the script, so that the command a
            # contributor runs before pushing is exactly this one. The guard runs
            # first because check-all.sh supplies -Dwarnings itself when RUSTFLAGS
            # is unset, which here would hide a name the -e list failed to forward.
            - name: Run checks in the devcontainer
              run: |
                # --pull never: the image just built, never a registry fallback.
                docker run --rm --pull never \
                    --mount "type=bind,source=${GITHUB_WORKSPACE},target=/root/kernel" \
                    --workdir /root/kernel \
                    -e RUSTFLAGS -e CARGO_TERM_COLOR \
                    "${DEVCONTAINER_IMAGE}:latest" \
                    bash -c '
                        set -euo pipefail
                        : "${RUSTFLAGS:?RUSTFLAGS was not forwarded into the container}"
                        bash .github/scripts/check-all.sh --github
                    '

    boot:
        name: Boot (QEMU aarch64 virt)
        needs: checks
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # Main is the only branch that publishes the devcontainer image, which
        # then serves as the layer cache every pull request pulls from. Same
        # discipline as a build cache: write on main, read everywhere else. Job
        # permissions replace the workflow's, so contents is restated.
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                # Nothing after checkout uses git credentials, so none are persisted.
                persist-credentials: false

            # This is the image the last steps publish. BUILDKIT_INLINE_CACHE=1
            # writes the cache metadata into it, which is what lets the next
            # run's --cache-from find its layers.
            - name: Build the devcontainer image
              run: |
                docker buildx build \
                    --load \
                    --build-arg BUILDKIT_INLINE_CACHE=1 \
                    --cache-from "type=registry,ref=${DEVCONTAINER_IMAGE}:latest" \
                    --tag "${DEVCONTAINER_IMAGE}:latest" \
                    --file .devcontainer/Dockerfile \
                    .devcontainer

            # Debug and release are both booted here. They differ enough in
            # layout and inlining that a debug-only boot test has let real faults
            # through in other kernels.
            - name: Boot in the devcontainer and expect the greeting
              run: |
                # --pull never: the image just built, never a registry fallback.
                docker run --rm --pull never \
                    --mount "type=bind,source=${GITHUB_WORKSPACE},target=/root/kernel" \
                    --workdir /root/kernel \
                    -e RUSTFLAGS -e CARGO_TERM_COLOR \
                    "${DEVCONTAINER_IMAGE}:latest" \
                    bash -c '
                        set -euo pipefail
                        # -e forwards it; a name missing there arrives unset, and warnings pass again.
                        : "${RUSTFLAGS:?RUSTFLAGS was not forwarded into the container}"
                        cargo --locked xtask boot-test --arch aarch64 --expect "Kaya!"
                        cargo --locked xtask boot-test --arch aarch64 --release --expect "Kaya!"
                        cargo --locked xtask boot-test --arch aarch64 --features provoke-exception --expect "BRK instruction"
                    '

            # Publishing comes last on purpose, and each step runs only if every
            # step before it succeeded: an image becomes the cache for every pull
            # request only after it has been shown to build the kernel *and* boot
            # it. The login sits here rather than before the build because the
            # cache pull needs no credentials (pull requests make it without
            # any), so the token is on disk only for the push.
            - name: Log in to GitHub Container Registry
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            - name: Publish the devcontainer image
              run: docker push "${DEVCONTAINER_IMAGE}:latest"

            # docker login stores the token in ~/.docker/config.json; remove it
            # whatever happened above.
            - name: Log out of GitHub Container Registry
              if: ${{ always() }}
              run: docker logout ghcr.io

    ci-success:
        name: CI Success
        needs: [checks, boot]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: ${{ !cancelled() }}

        steps:
            - name: Check if all jobs succeeded
              env:
                CHECKS_RESULT: ${{ needs.checks.result }}
                BOOT_RESULT: ${{ needs.boot.result }}
              run: |
                if [[ "$CHECKS_RESULT" != "success" ]] ||
                   [[ "$BOOT_RESULT" != "success" ]]; then
                    echo "One or more jobs failed"
                    exit 1
                fi
                echo "All jobs completed successfully"
