name: CI - Main Branch

# Read-only by default. The one job that publishes raises its own scope below,
# so the checks job never holds write access to the registry.
permissions:
    contents: read
    packages: read

on:
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# devcontainers/ci does not, by default (inheritEnv), carry the runner's
# environment into the container: it forwards only the variables its `env` input
# names, plus the GITHUB_* file paths. Every devcontainers/ci step therefore
# names CARGO_TERM_COLOR and RUSTFLAGS there; a bare name takes its value from
# this block, which stays the single source.
env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: "-Dwarnings"
    DEVCONTAINER_IMAGE: ghcr.io/setonix-os/kernel-devcontainer

# Identical to ci_pr.yml except that this workflow *publishes* the devcontainer
# image after the checks pass, so pull requests never build from an image that
# has not itself been proven to build and boot the kernel.
jobs:
    checks:
        name: Checks (pins, spelling, fmt, clippy, markdown)
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                # Nothing after checkout uses git credentials, so none are persisted.
                persist-credentials: false

            - name: Run checks in the devcontainer
              uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
              with:
                imageName: ${{ env.DEVCONTAINER_IMAGE }}
                cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
                # Published only after the boot job below has also passed, so
                # this step builds and runs without pushing.
                push: never
                env: |
                    CARGO_TERM_COLOR
                    RUSTFLAGS
                # The list of checks exists once, in the script, so that the command a
                # contributor runs before pushing is exactly this one. The guard runs
                # first because check-all.sh supplies -Dwarnings itself when RUSTFLAGS
                # is unset, which here would hide a name with.env failed to forward.
                runCmd: |
                    set -euo pipefail
                    : "${RUSTFLAGS:?RUSTFLAGS was not forwarded into the container}"
                    bash .github/scripts/check-all.sh --github

    boot:
        name: Boot (QEMU aarch64 virt)
        needs: checks
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # Main is the only branch that publishes the devcontainer image, which
        # then serves as the layer cache every pull request pulls from. Same
        # discipline as a build cache: write on main, read everywhere else. Job
        # permissions replace the workflow's, so contents is restated.
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                # Nothing after checkout uses git credentials, so none are persisted.
                persist-credentials: false

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            # Debug and release are both booted here. They differ enough in
            # layout and inlining that a debug-only boot test has let real faults
            # through in other kernels.
            #
            # This step also publishes the image, and does so last on purpose: an
            # image only becomes the cache for every pull request after it has
            # been shown to build the kernel *and* boot it.
            - name: Boot in the devcontainer, then publish the image
              uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
              with:
                imageName: ${{ env.DEVCONTAINER_IMAGE }}
                cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
                push: always
                env: |
                    CARGO_TERM_COLOR
                    RUSTFLAGS
                runCmd: |
                    set -euo pipefail
                    # with.env forwards it; a name missing there arrives unset, and warnings pass again.
                    : "${RUSTFLAGS:?RUSTFLAGS was not forwarded into the container}"
                    cargo --locked xtask boot-test --arch aarch64 --expect "Kaya!"
                    cargo --locked xtask boot-test --arch aarch64 --release --expect "Kaya!"
                    cargo --locked xtask boot-test --arch aarch64 --features provoke-exception --expect "BRK instruction"

    ci-success:
        name: CI Success
        needs: [checks, boot]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: ${{ !cancelled() }}

        steps:
            - name: Check if all jobs succeeded
              run: |
                if [[ "${{ needs.checks.result }}" != "success" ]] ||
                   [[ "${{ needs.boot.result }}" != "success" ]]; then
                    echo "One or more jobs failed"
                    exit 1
                fi
                echo "All jobs completed successfully"
