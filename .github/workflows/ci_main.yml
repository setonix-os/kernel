name: CI - Main Branch

permissions:
    contents: read

on:
    push:
        branches: [main]

# Main runs the same checks as ci_pr.yml, with one difference: it *saves* the
# caches that pull-request runs restore read-only. Keeping the write side on
# main only means a PR can never poison the cache for every other branch.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: "-Dwarnings"

jobs:
    quick-checks:
        name: Quick Checks (pins, spelling, fmt, markdown)
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Verify Rust toolchain pin consistency
              run: bash .github/scripts/check-toolchain-pin.sh

            - name: Verify British spelling
              run: bash .github/scripts/check-british-spelling.sh

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # v1.95.0 (latest stable)
              with:
                components: rustfmt

            - name: Setup Node.js
              id: setup-node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                node-version: "lts/*"

            - name: Get markdownlint-cli2 version
              id: mdlint-version
              run: echo "version=$(npm view markdownlint-cli2 version)" >> "$GITHUB_OUTPUT"

            - name: Restore npm cache
              id: npm-cache-restore
              uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                path: ~/.npm
                key: npm-markdownlint-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-mdlint-${{ steps.mdlint-version.outputs.version }}

            - name: Install markdownlint-cli2
              run: npm install -g markdownlint-cli2

            - name: Check formatting
              run: cargo fmt --all --check

            - name: Lint markdown
              run: markdownlint-cli2 "**/*.md"

            - name: Save npm cache
              if: steps.npm-cache-restore.outputs.cache-hit != 'true'
              uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                path: ~/.npm
                key: npm-markdownlint-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-mdlint-${{ steps.mdlint-version.outputs.version }}

    build:
        name: Build (${{ matrix.target }})
        needs: quick-checks
        runs-on: ubuntu-latest
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                target: [aarch64-unknown-none, x86_64-unknown-none]

        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # v1.95.0 (latest stable)
              with:
                targets: ${{ matrix.target }}
                components: clippy, rust-src

            - name: Get Rust version
              id: rust-version
              run: echo "version=$(rustc --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

            - name: Restore Rust cache
              id: cache-restore
              uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                path: |
                    ~/.cargo/bin/
                    ~/.cargo/registry/index/
                    ~/.cargo/registry/cache/
                    ~/.cargo/git/db/
                    target/
                key: rust-${{ matrix.target }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
                restore-keys: |
                    rust-${{ matrix.target }}-${{ steps.rust-version.outputs.version }}-

            - name: Run Clippy
              run: cargo clippy --package setonix-kernel --all-features --target ${{ matrix.target }} -- -D warnings

            - name: Build (debug)
              run: cargo build --verbose --package setonix-kernel --target ${{ matrix.target }}

            - name: Build (release)
              run: cargo build --release --verbose --package setonix-kernel --target ${{ matrix.target }}

            - name: Clippy (xtask, host)
              run: cargo clippy --package xtask --all-targets --all-features -- -D warnings

            - name: Run host tests
              run: cargo test --verbose --package xtask

            - name: Save Rust cache
              if: steps.cache-restore.outputs.cache-hit != 'true'
              uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                path: |
                    ~/.cargo/bin/
                    ~/.cargo/registry/index/
                    ~/.cargo/registry/cache/
                    ~/.cargo/git/db/
                    target/
                key: rust-${{ matrix.target }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

    boot:
        name: Boot (QEMU aarch64 virt)
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 15

        # aarch64 only, for now. x86_64 q35 has no bare-ELF equivalent of
        # -kernel, so booting it needs a UEFI stub and an ESP image that do not
        # exist yet — see kernel/src/arch/x86_64/mod.rs. Add it to a matrix here
        # the moment that lands; until then a second entry would only produce a
        # permanently red job, which trains everyone to ignore this one.
        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Install QEMU
              run: |
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends qemu-system-arm

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # v1.95.0 (latest stable)
              with:
                targets: aarch64-unknown-none
                components: rust-src

            - name: Boot and expect the greeting
              run: cargo xtask boot-test --arch aarch64 --expect "Kaya!"

            # Release builds differ enough in layout and inlining that a
            # debug-only boot test has let real faults through in other kernels.
            - name: Boot the release image
              run: cargo xtask boot-test --arch aarch64 --release --expect "Kaya!"

    ci-success:
        name: CI Success
        needs: [quick-checks, build, boot]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: ${{ !cancelled() }}

        steps:
            - name: Check if all jobs succeeded
              run: |
                if [[ "${{ needs.quick-checks.result }}" != "success" ]] ||
                   [[ "${{ needs.build.result }}" != "success" ]] ||
                   [[ "${{ needs.boot.result }}" != "success" &&
                      "${{ needs.boot.result }}" != "skipped" ]]; then
                    echo "One or more jobs failed"
                    exit 1
                fi
                echo "All jobs completed successfully"
