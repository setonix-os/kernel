name: CI - Pull Request

permissions:
    contents: read
    # Read-only on pull requests: the image is pulled as a layer cache, never
    # pushed. Only main publishes (see ci_main.yml), so a pull request cannot
    # poison the image every other branch builds from.
    packages: read

on:
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: "-Dwarnings"
    DEVCONTAINER_IMAGE: ghcr.io/setonix-os/kernel-devcontainer

# Every job runs inside the devcontainer built from .devcontainer/Dockerfile —
# the same image contributors get from "Reopen in Container" (constitution §7).
# Nothing installs a toolchain of its own, so there is no second source of truth
# for any tool version and no "works on my machine" gap to argue about.
#
# The image is built from the Dockerfile *as it appears in this pull request*, so
# a change to the environment is tested by the same run that proposes it. Layers
# come from the cache published by main, so an unchanged Dockerfile costs a pull
# rather than a build.
jobs:
    checks:
        name: Checks (pins, spelling, fmt, clippy, markdown)
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Run checks in the devcontainer
              uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
              with:
                imageName: ${{ env.DEVCONTAINER_IMAGE }}
                cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
                push: never
                runCmd: |
                    set -euo pipefail

                    echo "::group::Environment"
                    rustc --version
                    cargo --version
                    qemu-system-aarch64 --version | head -1
                    markdownlint-cli2 --version
                    echo "::endgroup::"

                    echo "::group::Toolchain pins"
                    bash .github/scripts/check-toolchain-pin.sh
                    echo "::endgroup::"

                    echo "::group::British spelling"
                    bash .github/scripts/check-british-spelling.sh
                    echo "::endgroup::"

                    echo "::group::Formatting"
                    cargo fmt --all --check
                    echo "::endgroup::"

                    echo "::group::Markdown"
                    markdownlint-cli2 "**/*.md"
                    echo "::endgroup::"

                    # Both Tier-1 architectures on every pull request, so neither
                    # becomes the one that only builds "usually" (§6). Scoped by
                    # package: the workspace holds two crates with incompatible
                    # targets, and an unscoped --target would try to build the
                    # host tool for bare metal.
                    for target in aarch64-unknown-none-softfloat x86_64-unknown-none; do
                        echo "::group::$target"
                        cargo clippy --package setonix-kernel --all-features --target "$target" -- -D warnings
                        cargo build --verbose --package setonix-kernel --target "$target"
                        cargo build --release --verbose --package setonix-kernel --target "$target"
                        echo "::endgroup::"
                    done

                    echo "::group::xtask (host)"
                    cargo clippy --package xtask --all-targets --all-features -- -D warnings
                    cargo test --verbose --package xtask
                    echo "::endgroup::"

    boot:
        name: Boot (QEMU aarch64 virt)
        needs: checks
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # The smoke test that matters. One assertion, but it exercises the
            # link script, the boot stub, the stack, .bss zeroing, the
            # hardware-abstraction boundary and the PL011 together — nothing else
            # available at this stage covers that much. Plain TCG, so no KVM and
            # no privileged container are required.
            #
            # x86_64 is absent on purpose: q35 has no bare-ELF equivalent of
            # -kernel, so that path needs a UEFI stub before it can boot at all.
            # `cargo xtask boot-test --arch x86_64` says so explicitly rather
            # than failing obscurely.
            # Two boots: the ordinary path must greet, and the provoked path
            # must fault into the exception reporter and decode the BRK — so the
            # vector table is proven on every pull request, not trusted.
            - name: Boot in the devcontainer and expect the greeting
              uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
              with:
                imageName: ${{ env.DEVCONTAINER_IMAGE }}
                cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
                push: never
                runCmd: |
                    set -euo pipefail
                    cargo xtask boot-test --arch aarch64 --expect "Kaya!"
                    cargo xtask boot-test --arch aarch64 --features provoke-exception --expect "BRK instruction"

    ci-success:
        name: CI Success
        needs: [checks, boot]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: ${{ !cancelled() }}

        steps:
            - name: Check if all jobs succeeded
              run: |
                if [[ "${{ needs.checks.result }}" != "success" ]] ||
                   [[ "${{ needs.boot.result }}" != "success" ]]; then
                    echo "One or more jobs failed"
                    exit 1
                fi
                echo "All jobs completed successfully"
