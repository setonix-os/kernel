name: CI - Pull Request

# Nothing here touches the registry: the layer cache is pulled anonymously, and
# no step logs in or pushes. That alone protects the registry only from forks,
# whose token is read-only whatever a workflow asks for. A branch in this
# repository can rewrite this file, so it is main's publishing build that holds
# the line: it uses no cache at all (devcontainer.sh build --publish), and an
# image main publishes never inherits a layer a branch could have pushed.
permissions:
    contents: read

on:
    # Every base branch, not only main: a stacked pull request, based on
    # another feature branch, gets CI too.
    pull_request:
        branches: ["**"]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

# The single source of these values. devcontainer.sh forwards CARGO_TERM_COLOR
# and RUSTFLAGS into the container by name, and reads DEVCONTAINER_IMAGE.
env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: "-Dwarnings"
    DEVCONTAINER_IMAGE: ghcr.io/setonix-os/kernel-devcontainer

# bash with pipefail, rather than the runner's default of plain `bash -e`.
defaults:
    run:
        shell: bash

# Every job runs inside the devcontainer built from .devcontainer/Dockerfile —
# the same image contributors get from "Reopen in Container" (constitution §7).
# Nothing installs a toolchain of its own, so there is no second source of truth
# for any tool version and no "works on my machine" gap to argue about.
#
# The image is built from the Dockerfile *as it appears in this pull request*, so
# a change to the environment is tested by the same run that proposes it. Layers
# come from the cache published by main, so an unchanged Dockerfile costs a pull
# rather than a build.
#
# Plain docker, not a third-party action: workflows use only actions owned by
# GitHub or by setonix-os (CLAUDE.md § Toolchain). .github/scripts/devcontainer.sh
# holds every docker flag, says what each is for, and lists what it keeps of
# the devcontainers/ci action CI used before and what it deliberately drops.
jobs:
    checks:
        name: Checks (pins, spelling, fmt, clippy, markdown)
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                # Nothing after checkout uses git credentials, so none are persisted.
                persist-credentials: false

            - name: Build the devcontainer image
              run: bash .github/scripts/devcontainer.sh build

            # The list of checks exists once, in the script, so that the command a
            # contributor runs before pushing is exactly this one. The guard runs
            # first because check-all.sh supplies -Dwarnings itself when RUSTFLAGS
            # is unset, which here would hide a name devcontainer.sh failed to forward.
            - name: Run checks in the devcontainer
              run: |
                bash .github/scripts/devcontainer.sh run -- bash -c '
                    set -euo pipefail
                    : "${RUSTFLAGS:?RUSTFLAGS was not forwarded into the container}"
                    bash .github/scripts/check-all.sh --github
                '

    boot:
        name: Boot (QEMU aarch64 virt)
        needs: checks
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                # Nothing after checkout uses git credentials, so none are persisted.
                persist-credentials: false

            - name: Build the devcontainer image
              run: bash .github/scripts/devcontainer.sh build

            # The smoke test that matters. One assertion, but it exercises the
            # link script, the boot stub, the stack, .bss zeroing, the
            # hardware-abstraction boundary and the PL011 together — nothing else
            # available at this stage covers that much. Plain TCG, so no KVM and
            # no privileged container are required.
            #
            # x86_64 is absent on purpose: QEMU's -kernel loads a 64-bit ELF only
            # with a Xen PVH note, and the image has neither that nor a UEFI stub.
            # `cargo xtask boot-test --arch x86_64` says so explicitly rather
            # than failing obscurely.
            # Three boots, the same three main runs: the ordinary path must greet
            # in debug and in release, which differ enough in layout and
            # inlining that a debug-only boot test has let real faults through
            # in other kernels; and the provoked path must fault into the
            # exception reporter and decode the BRK — so the vector table is
            # proven on every pull request, not trusted.
            - name: Boot in the devcontainer and expect the greeting
              run: |
                bash .github/scripts/devcontainer.sh run -- bash -c '
                    set -euo pipefail
                    # devcontainer.sh forwards it; a name missing there arrives unset, and warnings pass again.
                    : "${RUSTFLAGS:?RUSTFLAGS was not forwarded into the container}"
                    cargo --locked xtask boot-test --arch aarch64 --expect "Kaya!"
                    cargo --locked xtask boot-test --arch aarch64 --release --expect "Kaya!"
                    cargo --locked xtask boot-test --arch aarch64 --features provoke-exception --expect "BRK instruction"
                '

    ci-success:
        name: CI Success
        needs: [checks, boot]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: ${{ !cancelled() }}

        steps:
            - name: Check if all jobs succeeded
              env:
                CHECKS_RESULT: ${{ needs.checks.result }}
                BOOT_RESULT: ${{ needs.boot.result }}
              run: |
                if [[ "$CHECKS_RESULT" != "success" ]] ||
                   [[ "$BOOT_RESULT" != "success" ]]; then
                    echo "One or more jobs failed"
                    exit 1
                fi
                echo "All jobs completed successfully"
