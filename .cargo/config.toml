# No default build target is set on purpose.
#
# This workspace's crates want different targets: `setonix-kernel` only ever
# cross-compiles to a bare-metal target, `xtask` only ever builds for the host,
# and `setonix-capability` builds for both. A `[build] target` would be wrong
# for at least one of them whichever value it took, so targets are always named
# explicitly. `cargo xtask` is the front door and handles the targets for you.

[alias]
xtask = "run --package xtask --"
