[package]
name = "setonix-kernel"
version = "0.0.0"
description = "The Setonix microkernel"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "setonix-kernel"
path = "src/main.rs"
# There is no test harness on a bare-metal target: libtest needs an operating
# system underneath it, which is precisely what this crate is. Architecture-
# independent logic is tested from the host as it appears; architecture-specific
# behaviour is tested by booting under QEMU (`cargo xtask boot-test`).
test = false
bench = false

[features]
# Boot, greet, then take a deliberate BRK — so the boot self-test can prove the
# exception vector table and reporter work end to end. Never on by default;
# enabled by `cargo xtask boot-test --features provoke-exception`.
provoke-exception = []

[lints]
workspace = true
